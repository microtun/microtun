# microtun Peers API server - example configuration.

[Server]
# The Peers API server's tunnel identity.
PrivateKey = +FjyECUtAzQ/UZvyw4ogXGp8uhPRri9pVOdudoRRJ0E=
# UDP port the tunnel protocol listens on, across every local address. Write an
# address and port instead (`0.0.0.0:51820`, `[::]:51820`) to bind just one.
ListenPort = 51820
# Forward authenticated type-5 relay packets between configured peers. This is
# intentionally disabled by default; changing it on a running server requires
# a restart.
RelayForwarding = false
# The Peers API server is also a network peer, so the rest of its record goes here
# rather than in a [Peer.name] section of its own. The API listens on port 80 at
# every address below, so these should normally be host prefixes (/32 or /128).
Endpoint = 203.0.113.10:51820
Addresses = 10.0.0.1/32


# One named [Peer.name] section per peer. Names are local aliases.
[Peer.my-relay]
PublicKey = 07dnTjJ6nzHKA1IqzSzEmK967uuT1ZoFa55/b6ThO0I=
# Outer endpoint (public IP:port). Omit for peers that roam or sit behind NAT.
Endpoint = 198.51.100.20:51820
# Tunnel prefixes owned by this peer: up to four, comma- or space-separated,
# and the key may repeat. Longest prefix wins a by-address lookup. A missing
# prefix length means a host prefix, so `10.0.0.3` and `10.0.0.3/32` are the
# same entry; host bits on a shorter prefix are cleared with a warning.
Addresses = 10.0.0.3/32
# WireGuard-style keepalive seconds. Omit it or set 0 to disable.
PersistentKeepalive = 25

[Peer.site-network]
PublicKey = rz/4664fkjDuRBrdo/LpptaxafT/xUSKKDFyhOgVXSw=rz/4664fkjDuRBrdo/LpptaxafT/xUSKKDFyhOgVXSw=
Addresses = 10.5.0.0/24

[Peer.laptop]
PublicKey = Pvub4L2atK2PJNTeVBkFAOW+pl+/Z25rjQFlDpWcqG4=
Addresses = 10.0.0.7/32
# Reachable through one directly reachable peer, named by its section alias.
# The relay needs a record of its own with a direct endpoint; relay chaining is
# not supported. Use the reserved alias `@server` to relay through this API
# server's own [Server] record (with RelayForwarding = true). A public key is
# also accepted.
Relay = my-relay
# Relay = @server
