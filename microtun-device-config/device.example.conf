# microtun provisioning example. 

[Microtun]
ApiVersion = microtun.dev/v1alpha1
Kind = Device

[Tunnel]
PrivateKey = MzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzM=
Address = 100.64.0.3/10
# IPv4 and IPv6 are supported. A bare address is treated as /32 or /128.
# Optional tunnel settings:
# MTU = 1280
# ListenPort = 51820
# EnableForwarding = true

# Omit this section on wired-only targets.
[WiFi]
SSID = YOUR_WIFI_SSID
Password = YOUR_WIFI_PASSWORD

[ApiServer]
Host = console.microtun.dev
Port = 51820
PublicKey = e06Qm75//kTEZaIgA31gjuNYl9Me+XLwf3SJLLD3PxM=
# A bare host is preferred here. CIDR input is also accepted; only the host
# address is used for the API server peer.
TunnelAddress = 100.64.0.1

# Optional: omit this section if this target should not synchronize time over NTP.
[NTP]
Host = time.google.com
Port = 123
