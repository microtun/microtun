name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  workspace:
    name: Lint, build, and test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          rustflags: ""
          cache: false

      - name: Show Rust versions
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A workspace-wide build unifies features from all selected crates. These
      # checks keep important minimal/embedded configurations from being masked
      # by host crates that enable alloc, async, or logging features.
      - name: Check isolated feature modes
        run: |
          cargo check --locked -p microtun-core --no-default-features
          cargo check --locked -p microtun-api --no-default-features
          cargo check --locked -p microtun-embassy --no-default-features
          cargo check --locked -p microtun-jsonrpc --no-default-features --features sync

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Test documentation
        run: cargo test --workspace --doc --locked

  examples:
    name: Build example (${{ matrix.name }})
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nucleo-h753zi
            directory: examples/nucleo-h753zi
            target: thumbv7em-none-eabi

          - name: esp32-c3
            directory: examples/esp32-c3
            target: riscv32imc-unknown-none-elf

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain and target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false

      - name: Show Rust versions
        run: |
          rustc --version --verbose
          cargo --version --verbose

      # Run from the example directory so Cargo loads its local .cargo/config.toml.
      # Both examples contain non-secret placeholder configuration suitable for CI.
      - name: Build ${{ matrix.name }} firmware
        working-directory: ${{ matrix.directory }}
        run: cargo build --locked