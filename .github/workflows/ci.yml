name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.1"
  # rustfmt.toml uses unstable options (group_imports, imports_granularity) that stable
  # rustfmt silently ignores, so formatting is checked with a pinned nightly rustfmt.
  # Bump deliberately; a new nightly can change formatting.
  RUSTFMT_TOOLCHAIN: "nightly-2026-09-01"

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install nightly rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUSTFMT_TOOLCHAIN }}
          components: rustfmt
          rustflags: ""
          cache: false

      - name: Check formatting (host workspace)
        run: cargo fmt --all -- --check

      # The firmware workspace is excluded from the root workspace, so the root
      # `cargo fmt --all` never reaches it.
      - name: Check formatting (firmware workspace)
        working-directory: firmware
        run: cargo fmt --all -- --check

  workspace:
    name: Lint, build, and test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check workspace versions
        run: scripts/check-release-tag.sh

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          rustflags: ""
          cache: false

      - name: Show Rust versions
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A workspace-wide build unifies features from all selected crates. These
      # checks keep important minimal/embedded configurations from being masked
      # by host crates that enable alloc, async, or logging features.
      - name: Check isolated feature modes
        run: |
          cargo check --locked -p microtun-core --no-default-features
          cargo check --locked -p microtun-api --no-default-features
          cargo check --locked -p microtun-embassy --no-default-features

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Test documentation
        run: cargo test --workspace --doc --locked

  debian-package:
    name: Build Debian package (amd64)
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/amd64
          target: debs
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=debs-amd64
          cache-to: type=gha,mode=max,scope=debs-amd64

      - name: Verify Debian packages
        run: |
          set -euo pipefail
          version="$(dpkg-parsechangelog -S Version)"
          package="dist/microtun_${version}_amd64.deb"
          find dist -type f -name '*.deb' -print
          test -s "$package"
          test -n "$(find dist -type f -name '*.deb' -print -quit)"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"

  firmware-host:
    name: Lint, build, and test firmware workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          rustflags: ""
          cache: false

      # Run from firmware/ itself: no board .cargo/config.toml applies there, so these
      # crates build for the host and their unit tests can run.
      - name: Lint firmware build support
        working-directory: firmware
        run: cargo clippy --locked -p microtun-firmware-build --all-targets -- -D warnings

      - name: Test firmware build support and shared firmware code
        working-directory: firmware
        run: cargo test --locked -p microtun-firmware-build -p microtun-firmware-common

  firmware:
    name: Build firmware (${{ matrix.name }})
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nucleo-h753zi
            directory: firmware/nucleo-h753zi/app
            package: microtun-nucleo-h753zi
            target: thumbv7em-none-eabi

          - name: nucleo-h753zi-bootloader
            directory: firmware/nucleo-h753zi/bootloader
            package: microtun-nucleo-h753zi-bootloader
            target: thumbv7em-none-eabi

          - name: esp32-c6-plc-v
            directory: firmware/esp32-c6-plc-v/app
            package: microtun-esp32-c6-plc-v
            # Must match [build] target in the firmware target's .cargo/config.toml.
            target: riscv32imac-unknown-none-elf

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain and target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          components: clippy
          rustflags: ""
          cache: false

      - name: Show Rust versions
        run: |
          rustc --version --verbose
          cargo --version --verbose

      # Run from the firmware target's own directory so Cargo loads its local .cargo/config.toml,
      # which supplies the target and linker arguments. All board firmware shares one workspace
      # (firmware/Cargo.toml) and therefore one lockfile, so -p selects the board to build.
      #
      # MICROTUN_FIRMWARE_PUBLIC_KEY_PEM_PATH is deliberately unset: the build embeds the
      # development update key (see firmware/build-support/README.md), so pull requests,
      # including ones from forks, need neither the signing service nor any credentials.
      # Release builds require the real key and are produced by release.yml.
      - name: Lint ${{ matrix.name }}
        working-directory: ${{ matrix.directory }}
        run: cargo clippy --locked -p ${{ matrix.package }} -- -D warnings

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.directory }}
        run: cargo build --locked -p ${{ matrix.package }}
