name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MICROTUN_SIGNER_VERSION: "v0.6.0"
  MICROTUN_SIGNER_URL: "https://signer.microtun.dev"
  MICROTUN_SIGNER_KEY_ID: "microtun-firmware-prod"

defaults:
  run:
    shell: bash

jobs:
  workspace:
    name: Lint, build, and test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check workspace versions
        run: scripts/check-release-tag.sh

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          rustflags: ""
          cache: false

      - name: Show Rust versions
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A workspace-wide build unifies features from all selected crates. These
      # checks keep important minimal/embedded configurations from being masked
      # by host crates that enable alloc, async, or logging features.
      - name: Check isolated feature modes
        run: |
          cargo check --locked -p microtun-core --no-default-features
          cargo check --locked -p microtun-api --no-default-features
          cargo check --locked -p microtun-embassy --no-default-features

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Test documentation
        run: cargo test --workspace --doc --locked

  examples:
    name: Build example (${{ matrix.name }})
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nucleo-h753zi
            directory: examples/nucleo-h753zi/app
            package: microtun-nucleo-h753zi
            target: thumbv7em-none-eabi

          - name: esp32-c6-plc-v
            directory: examples/esp32-c6-plc-v/app
            package: microtun-esp32-c6-plc-v
            # Must match [build] target in the example's .cargo/config.toml.
            target: riscv32imac-unknown-none-elf

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain and target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          rustflags: ""
          cache: false

      - name: Show Rust versions
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Install microtun-signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signer_version="${MICROTUN_SIGNER_VERSION#v}"
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64|arm64) ;;
            *) echo "Unsupported microtun-signer Debian architecture: $arch" >&2; exit 1 ;;
          esac
          package="microtun-signer_${signer_version}_${arch}.deb"
          mkdir -p "$RUNNER_TEMP/microtun-signer-package"
          gh release download "$MICROTUN_SIGNER_VERSION" \
            --repo microtun/microtun-signer \
            --pattern "$package" \
            --dir "$RUNNER_TEMP/microtun-signer-package"
          sudo apt-get install -y "$RUNNER_TEMP/microtun-signer-package/$package"
          microtun-signer --version

      - name: Configure firmware public key
        run: |
          public_key="$RUNNER_TEMP/microtun-firmware-public-key.pem"
          microtun-signer public-key \
            --key-id "$MICROTUN_SIGNER_KEY_ID" \
            > "$public_key"
          test -s "$public_key"
          key_cache="$(sha256sum "$public_key" | cut -d' ' -f1)"
          echo "MICROTUN_FIRMWARE_PUBLIC_KEY_PEM_PATH=$public_key" >> "$GITHUB_ENV"
          echo "MICROTUN_FIRMWARE_PUBLIC_KEY_CACHE_KEY=$key_cache" >> "$GITHUB_ENV"

      # Run from the example's own directory so Cargo loads its local .cargo/config.toml, which
      # is what supplies the target and the linker arguments. The examples share one workspace
      # (examples/Cargo.toml) and therefore one lockfile, so -p selects the board to build.
      # Both examples contain non-secret placeholder device configuration suitable for CI.
      - name: Build ${{ matrix.name }} firmware
        working-directory: ${{ matrix.directory }}
        run: cargo build --locked -p ${{ matrix.package }}