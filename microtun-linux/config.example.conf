# microtun Linux client - example configuration.
# Keep this file mode 600 because it contains the tunnel private key.

[Interface]
# Local tunnel identity, in the same base64 form used by WireGuard tools.
PrivateKey = oLHC0+T1BhcoOUpbbH2OnwobLD1OX2BxgpOktcbX6Pk=
# Outer UDP port. Defaults to 51820. An explicit bind address such as
# `[::]:51820` is also accepted.
ListenPort = 51820
# Linux TUN device name. Defaults to microtun0.
Name = microtun0
# Local inner address and prefix. Unlike ApiServer Addresses, host bits are retained.
Address = 10.0.0.2/24
# Inner MTU. Defaults to 1280.
MTU = 1280
# Forward authenticated relay traffic for other peers. Defaults to false.
RelayForwarding = false

# The Peers API server is a special bootstrap/control-plane endpoint, not a
# general statically configured tunnel peer. Other peers are learned dynamically.
[ApiServer]
PublicKey = scLT5PUGFyg5SltsfY6fChssPU5fYHGCk6S1xtfo+aA=
# Outer endpoint used for the bootstrap tunnel handshake. IPv4, bracketed IPv6,
# and DNS names are accepted. DNS is resolved once when the daemon starts.
Endpoint = api.example.com:51820
# Tunnel prefixes routed to the API server. The first address is also used as
# the Peers API host on port 80. The key may repeat and values may be separated
# by commas or whitespace. A missing prefix length means a host prefix.
Addresses = 10.0.0.1/32
# Optional WireGuard-style keepalive seconds; 0 or omission disables it.
# PersistentKeepalive = 25
