[package]
name = "microtun-nucleo-h753zi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

license = "BUSL-1.1"

[dependencies]
microtun-embassy = { path = "../../../microtun-embassy", features = ["defmt"] }
microtun-mcuboot = { path = "../../../microtun-mcuboot", features = ["defmt"] }
microtun-provisioning = { path = "../../../microtun-provisioning", default-features = false, features = ["embassy-net", "defmt"] }
microtun-net-util = { path = "../../../microtun-net-util", default-features = false, features = ["embassy-net"] }
microtun-telnet-cli = { git = "https://github.com/microtun/microtun-telnet-cli", rev = "v0.2.0" }
microtun-examples-common = { path = "../../common", features = ["defmt"] }

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "udp", "icmp", "dhcpv4", "dhcpv4-hostname", "dns", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "multicast"] }
embassy-net-driver-channel = { version = "0.4", default-features = false }
embassy-boot = { version = "0.7.0", default-features = false }
embedded-io-async = { version = "0.7.0", default-features = false }
embedded-storage = "0.3.1"
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h753zi", "time-driver-tim2", "chrono", "unstable-pac"] }
embassy-sync = { version = "0.8.0", default-features = false, features = ["defmt"] }
embassy-time = { version = "0.5.1", default-features = false, features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
heapless = { version = "0.9.1", default-features = false }
chrono = { version = "0.4", default-features = false }
static_cell = "2"
rand_core = { version = "0.6", default-features = false }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

[build-dependencies]
base64 = "0.22.1"
cargo-emit = "0.2.1"
vergen-gix = "9.1.0"

[profile.dev]
debug = 2
incremental = false
codegen-units = 1
opt-level = 's'
lto = 'fat'

[profile.release]
debug = 2
incremental = false
codegen-units = 1
opt-level = 's'
lto = 'fat'
