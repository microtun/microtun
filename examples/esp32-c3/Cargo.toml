[package]
name = "microtun-esp32-c3"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

license = "BUSL-1.1"

[dependencies]
microtun-embassy = { path = "../../microtun-embassy", features = ["alloc", "log"] }
microtun-provision = { path = "../../microtun-provision", default-features = false }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-net = { version = "0.9.1", features = ["log", "tcp", "udp", "dhcpv4", "dns", "medium-ethernet", "medium-ip", "proto-ipv4"] }
embassy-net-driver-channel = { version = "0.4", default-features = false }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false, features = ["log"] }
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
heapless = { version = "0.9.1", default-features = false }
rand_core = { version = "0.6", default-features = false }
static_cell = "2"

sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false, features = ["ipv6"] }

log = { version = "0.4", default-features = false }

# ESP32-C3 only. esp-radio 1.0.0-beta.0 is the current Wi-Fi API generation
# using WifiController + Interface and esp-rtos for Embassy integration.
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-hal = { version = "~1.1", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
esp-radio = { version = "=1.0.0-beta.0", features = ["esp32c3", "log-04", "wifi"] }
esp-rtos = { version = "0.3.0", features = ["esp32c3", "esp-radio", "esp-alloc", "embassy", "log-04"] }
esp-storage = { version = "0.9.0", features = ["esp32c3"] }

# Espressif's radio and flash routines require optimization. Keep it explicit
# for debug builds so `cargo build` remains a useful firmware build.
[profile.dev]
debug = 2
incremental = false
codegen-units = 1
opt-level = 2
lto = "fat"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
debug = 2
incremental = false
codegen-units = 1
opt-level = 3
lto = "fat"
