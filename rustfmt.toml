# group_imports and imports_granularity are unstable rustfmt options: stable rustfmt ignores
# them with a warning. Format with the nightly pinned as RUSTFMT_TOOLCHAIN in
# .github/workflows/ci.yml (`cargo +nightly-2026-09-01 fmt --all`, here and in firmware/).
unstable_features = true
group_imports = "StdExternalCrate"
imports_granularity = "Crate"
