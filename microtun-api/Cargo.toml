[package]
name = "microtun-api"
description = "Peers API codec and client for microtun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
microtun-core = { workspace = true }
heapless = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde-json-core = { workspace = true }
microtun-jsonrpc = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[features]
default = []
# Typed client for `embedded-io-async` transports (Embassy and similar).
embedded-client = [
    "dep:microtun-jsonrpc",
    "dep:embedded-io-async",
    "dep:rand",
    "microtun-jsonrpc/async",
]
# Native Tokio 1.x transport support for the typed client. This is additive
# with `embedded-client` so Cargo feature unification remains valid.
tokio-client = [
    "dep:microtun-jsonrpc",
    "dep:embedded-io-async",
    "dep:rand",
    "microtun-jsonrpc/tokio",
]
# Forwarded to `microtun-core` for host integrations that use its allocator-
# backed peer/session/route storage. The owned wire record remains inline.
alloc = ["microtun-core/alloc"]
