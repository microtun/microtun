[package]
name = "microtun-firmware-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
defmt = [
    "dep:defmt",
    "defmt-or-log/defmt",
    "embassy-net/defmt",
    "embassy-time/defmt",
    "microtun-embassy/defmt",
    "microtun-mcuboot/defmt",
]
log = ["dep:log", "defmt-or-log/log", "microtun-embassy/log"]

[dependencies]
defmt-or-log = { version = "0.2.3", default-features = false }
defmt = { workspace = true, optional = true }
log = { workspace = true, optional = true }
embassy-sync = { workspace = true }
embassy-net = { workspace = true, features = [
    "dns",
    "icmp",
    "tcp",
    "udp",
    "proto-ipv4",
    "proto-ipv6",
] }
embassy-time = { workspace = true }
embedded-io-async = { workspace = true }
embedded-hal = { version = "1.0.0", default-features = false }
embedded-storage = { workspace = true }
crc = { version = "3.4", default-features = false }
heapless = { workspace = true }
microtun-core = { workspace = true }
microtun-embassy = { workspace = true }
microtun-mcuboot = { workspace = true }
microtun-cli = { workspace = true }
microtun-net-util = { workspace = true, features = ["embassy-net", "ping"] }
microtun-telnet = { workspace = true }
microtun-ymodem = { workspace = true }
rand_core = { workspace = true }
sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false, features = ["ipv6"] }