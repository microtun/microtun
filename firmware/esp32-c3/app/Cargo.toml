[package]
name = "microtun-esp32-c3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
microtun-embassy = { path = "../../../microtun-embassy", features = ["alloc", "log"] }
microtun-net-util = { path = "../../../microtun-net-util", default-features = false, features = ["embassy-net"] }
microtun-mcuboot = { path = "../../../microtun-mcuboot" }
microtun-cli = { path = "../../../microtun-cli" }
microtun-firmware-common = { path = "../../common", features = ["log"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-net = { version = "0.9.1", features = ["log", "tcp", "udp", "icmp", "dhcpv4", "dhcpv4-hostname", "dns", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "multicast"] }
embassy-net-driver-channel = { version = "0.4", default-features = false }
embassy-sync = { version = "0.8.0", default-features = false }
embassy-time = { version = "0.5.1", default-features = false, features = ["log"] }
embedded-io-async = { version = "0.7.0", default-features = false }
embedded-storage = "0.3.1"
heapless = { version = "0.9.1", default-features = false }
rand_core = { version = "0.6", default-features = false }
static_cell = "2"

log = { version = "0.4", default-features = false }

esp-alloc = "0.10.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-hal = { version = "~1.1", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
esp-radio = { version = "=1.0.0-beta.0", features = ["esp32c3", "log-04", "wifi"] }
esp-rtos = { version = "0.3.0", features = ["esp32c3", "esp-radio", "esp-alloc", "embassy", "log-04"] }
esp-storage = { version = "0.9.0", features = ["esp32c3"] }

[build-dependencies]
microtun-firmware-build = { path = "../../build-support" }
